# Publish a TermCrew release: bump VERSION, sync crates/npm, tag, upload binaries.
#
# Operator flow:
#   Actions → Release → Run workflow → bump = current | patch | minor | major
#
# Starts from root VERSION (1.0.0). No free-typed semver.
#   1. Next X.Y.Z from VERSION + bump
#   2. Writes VERSION; syncs backend/Cargo.toml + frontend/package.json
#   3. Commits onto the branch and creates annotated tag vX.Y.Z
#   4. Builds termcrew (Rust) on Windows, macOS (arm64), and Linux
#   5. GitHub Release with conventional-commit notes + binaries + SHA256SUMS
name: Release
run-name: "Release (${{ inputs.bump }}) — ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Bump from root VERSION (start 1.0.0). Use current for first release of the file as-is.
        required: true
        type: choice
        options:
          - current
          - patch
          - minor
          - major
        default: patch
      prerelease:
        description: Mark GitHub Release as prerelease
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.ver.outputs.current }}
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      bump: ${{ steps.ver.outputs.bump }}
      previous_tag: ${{ steps.ver.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Resolve bump from VERSION
        id: ver
        run: |
          set -euo pipefail
          BUMP="${{ github.event.inputs.bump }}"
          CURRENT="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be X.Y.Z (got '$CURRENT')" >&2
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<<"$CURRENT"
          case "$BUMP" in
            current) VER="$CURRENT" ;;
            patch)
              PATCH=$((PATCH + 1))
              VER="${MAJOR}.${MINOR}.${PATCH}"
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              VER="${MAJOR}.${MINOR}.${PATCH}"
              ;;
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              VER="${MAJOR}.${MINOR}.${PATCH}"
              ;;
            *)
              echo "unknown bump '$BUMP'" >&2
              exit 1
              ;;
          esac
          TAG="v${VER}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} already exists" >&2
            exit 1
          fi
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [[ -n "$PREV_TAG" && "$PREV_TAG" == "$TAG" ]]; then
            echo "previous tag equals new tag ${TAG}" >&2
            exit 1
          fi
          {
            echo "current=${CURRENT}"
            echo "version=${VER}"
            echo "tag=${TAG}"
            echo "bump=${BUMP}"
            echo "previous_tag=${PREV_TAG}"
          } >>"$GITHUB_OUTPUT"
          echo "bump ${BUMP}: ${CURRENT} -> ${VER} (tag ${TAG}; previous=${PREV_TAG:-none})"

      - name: Write VERSION and sync packages
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.ver.outputs.version }}" > VERSION
          bash ./scripts/sync_version.sh

      - name: Commit VERSION onto branch
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          BUMP="${{ steps.ver.outputs.bump }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION backend/Cargo.toml frontend/package.json README.md
          if git diff --cached --quiet; then
            echo "VERSION already at ${VER}; no package commit needed"
          else
            git commit -m "chore(release): ${BUMP} VERSION to ${VER}"
          fi
          git push origin "HEAD:${{ github.ref_name }}"
          git tag -a "${TAG}" -m "TermCrew ${TAG}"
          git push origin "${TAG}"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            suffix: linux-amd64
            exe: termcrew
          - runner: windows-latest
            suffix: windows-amd64
            exe: termcrew.exe
          - runner: macos-latest
            suffix: darwin-arm64
            exe: termcrew
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: backend

      - name: Build termcrew
        working-directory: backend
        run: cargo build --release

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ needs.prepare.outputs.version }}"
          SRC="backend/target/release/${{ matrix.exe }}"
          test -f "$SRC"
          OUT="termcrew-${VER}-${{ matrix.suffix }}"
          if [[ "${{ matrix.exe }}" == *.exe ]]; then
            OUT="${OUT}.exe"
          fi
          mkdir -p dist
          cp "$SRC" "dist/${OUT}"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          path: dist/release
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist/release
          sha256sum -- * > SHA256SUMS
          ls -la
          test -f "termcrew-${{ needs.prepare.outputs.version }}-linux-amd64"
          test -f "termcrew-${{ needs.prepare.outputs.version }}-windows-amd64.exe"
          test -f "termcrew-${{ needs.prepare.outputs.version }}-darwin-arm64"

      - name: Build categorized release notes
        id: notes
        run: |
          set -euo pipefail
          bash ./scripts/generate-release-notes.sh \
            "${{ needs.prepare.outputs.previous_tag }}" \
            "${{ needs.prepare.outputs.tag }}" \
            "${{ needs.prepare.outputs.bump }}" \
            "${{ needs.prepare.outputs.current }}" \
            "${{ needs.prepare.outputs.version }}" \
            >"${RUNNER_TEMP}/release-notes.md"
          echo "path=${RUNNER_TEMP}/release-notes.md" >>"$GITHUB_OUTPUT"
          echo "---- release notes preview ----"
          head -n 80 "${RUNNER_TEMP}/release-notes.md"

      - name: Publish GitHub Release + assets
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: TermCrew ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: false
          files: |
            dist/release/termcrew-${{ needs.prepare.outputs.version }}-linux-amd64
            dist/release/termcrew-${{ needs.prepare.outputs.version }}-windows-amd64.exe
            dist/release/termcrew-${{ needs.prepare.outputs.version }}-darwin-arm64
            dist/release/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
